<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>开始新旅程 - RideLog</title>
  <link rel="stylesheet" href="css/style.css?v=8">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="images/icon.png">
  <meta name="theme-color" content="#FF7B3D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Donke">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="js/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/login-modal.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js');
    }
  </script>
</head>
<body class="page-no-nav">
  <!-- Page Header -->
  <div class="page-header">
    <button class="back-btn" onclick="history.back()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>
    <div class="page-title">开始新的旅程</div>
  </div>

  <!-- Form -->
  <div style="padding: 8px 0 0;">
    <div class="form-group" style="margin: 16px 20px 0;">
      <label class="form-label">旅程标题</label>
      <input type="text" class="form-input" id="journey-title" placeholder="给你的旅程起个名字，例如：环青海湖骑行">
    </div>
  </div>

  <!-- Action Buttons -->
  <div style="margin: 20px 20px 0;">
    <button class="btn btn-primary" style="width:100%;" onclick="createJourney()">创建旅程</button>
  </div>

  <script src="js/app.js"></script>
  <script src="js/journey-service.js"></script>
  <script>
    async function createJourney() {
      if (!(await window.journeyService.isLoggedIn())) {
        window.requireAuth(async () => {
          await doCreateJourney();
        });
        return;
      }
      await doCreateJourney();
    }

    async function doCreateJourney() {
      const title = document.getElementById('journey-title').value.trim();
      if (!title) {
        alert('请填写旅程标题');
        return;
      }

      try {
        const journey = await window.journeyService.createJourney(title);
        location.href = 'my-records.html';
      } catch (err) {
        alert('创建失败：' + err.message);
      }
    }
  </script>
</body>
</html>
